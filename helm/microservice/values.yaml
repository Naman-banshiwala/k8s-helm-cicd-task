replicaCount: 2

image:
  repository: 881776924457.dkr.ecr.us-east-1.amazonaws.com/demo-microservice
  tag: "v1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

containerPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

ingress:
  enabled: false

autoscaling:
  enabled: false
